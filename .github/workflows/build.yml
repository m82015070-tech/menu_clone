name: build-menu-clone
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make git curl unzip

      - name: Get OpenOrbis toolchain
        run: |
          mkdir -p $HOME/oo && cd $HOME/oo
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz' || gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.zip'
          ls -la
          for f in *.tar.gz; do [ -e "$f" ] && tar xzf "$f"; done
          for f in *.zip; do [ -e "$f" ] && unzip -q "$f"; done
          TC=$(find $HOME/oo -type d -name PS4Toolchain | head -1)
          chmod -R +x "$TC/bin" || true
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV
          echo "toolchain at: $TC"
          ls "$TC/lib" | head -50

      - name: Build GoldHEN Plugins SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK $HOME/sdk
          cd $HOME/sdk && make
          echo "GOLDHEN_SDK=$HOME/sdk" >> $GITHUB_ENV

      - name: Get official plugin repo (for the real template + Makefile)
        run: git clone --depth 1 --recurse-submodules https://github.com/GoldHEN/GoldHEN_Plugins_Repository $HOME/repo

      - name: Compiler and linker helpers
        run: |
          # clang++ wrapper: our C++ must not need the C++ runtime library (the plugin links Sony libc only)
          mkdir -p $HOME/wrap
          REAL_CLANGPP=$(command -v clang++)
          REAL_LLD=$(command -v ld.lld)
          echo '#!/bin/bash' > $HOME/wrap/clang++
          echo "exec \"$REAL_CLANGPP\" \"\$@\" -fno-exceptions -fno-rtti -D_LIBCPP_DISABLE_EXTERN_TEMPLATE" >> $HOME/wrap/clang++
          # ld.lld wrapper: add the audio stub library when the toolchain has it
          # keep our own operator new/delete and helper symbols LOCAL (not exported to the game process)
          echo '{ global: *; local: _Znwm; _Znam; _ZdlPv; _ZdaPv; _ZdlPvm; _ZdaPvm; __errno_location; __assert_fail; };' > $HOME/wrap/vs.txt
          EXTRA="--version-script=$HOME/wrap/vs.txt"
          echo '#!/bin/bash' > $HOME/wrap/ld.lld
          echo "exec \"$REAL_LLD\" \"\$@\" $EXTRA" >> $HOME/wrap/ld.lld
          chmod +x $HOME/wrap/clang++ $HOME/wrap/ld.lld
          echo "$HOME/wrap" >> $GITHUB_PATH
          echo "--- clang++ wrapper"; cat $HOME/wrap/clang++
          echo "--- ld.lld wrapper"; cat $HOME/wrap/ld.lld

      - name: Put our code into the template
        run: |
          D=$HOME/repo/plugin_src/menu_clone
          cp -r $HOME/repo/plugin_src/plugin_template $D
          rm -rf $D/source && mkdir -p $D/source
          cp $GITHUB_WORKSPACE/*.cpp $GITHUB_WORKSPACE/*.h $D/source/
          curl -L -o $D/source/dr_mp3.h https://raw.githubusercontent.com/mackron/dr_libs/master/dr_mp3.h
          sed -i 's/plugin_template/menu_clone/g' $D/Makefile
          mkdir -p $HOME/repo/bin/plugins/elf_final $HOME/repo/bin/plugins/prx_final
          echo "=== Makefile used ==="; cat $D/Makefile

      - name: Build
        run: |
          cd $HOME/repo/plugin_src/menu_clone
          # libc++ headers (string, vector ...) live in the toolchain; the template Makefile does not point to them
          export CPLUS_INCLUDE_PATH="$OO_PS4_TOOLCHAIN/include/c++/v1"
          make -k 2>&1 | tee $HOME/build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Collect result
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/out
          find $HOME/repo/bin -type f -exec cp {} $GITHUB_WORKSPACE/out/ \;
          cd $GITHUB_WORKSPACE/out
          for f in *; do [ -f "$f" ] || continue; case "$f" in *.prx|*.elf|*.sprx) ;; *) mv "$f" "$f.prx" ;; esac; done
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu_clone_prx
          path: out/*
          if-no-files-found: warn
